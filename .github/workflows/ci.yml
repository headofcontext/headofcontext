name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra langgraph --extra crewai --extra pydanticai --extra mcp
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy --strict src
      - run: uv run pytest tests/unit tests/adversarial -q
      - run: uv build

  services:
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra langgraph --extra crewai --extra pydanticai --extra mcp
      - name: Start OpenFGA, Keycloak, PostgreSQL, Nextcloud
        run: docker compose up -d --wait
      - name: Load ACME into Nextcloud
        run: ./scripts/nextcloud-dev-setup.sh && uv run python scripts/load_nextcloud.py
      - name: OpenFGA model tests
        run: ./scripts/fga-model.sh
      - run: HOC_REQUIRE_SERVICES=1 uv run pytest tests/integration -q
      - run: HOC_REQUIRE_SERVICES=1 uv run pytest tests/golden -q
      - if: always()
        run: docker compose down -v

