name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch; a newer push cancels the previous run (the services job costs ~8 min).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra langgraph --extra crewai --extra pydanticai --extra mcp
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy --strict src
      - run: uv run pytest tests/unit tests/adversarial -q
      - name: OpenAPI contract matches the code
        run: uv run python scripts/export_openapi.py && git diff --exit-code docs/openapi.json
      - run: uv build

  services:
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra langgraph --extra crewai --extra pydanticai --extra mcp
      - name: Start OpenFGA, Keycloak, PostgreSQL, Nextcloud
        run: docker compose up -d --wait
      - name: Load ACME into Nextcloud
        run: ./scripts/nextcloud-dev-setup.sh && uv run python scripts/load_nextcloud.py
      - name: OpenFGA model tests, generated model matches the DSL
        run: ./scripts/fga-model.sh && git diff --exit-code docs/authz-model.json src/headofcontext/engines/openfga/authz-model.json
      - run: HOC_REQUIRE_SERVICES=1 uv run pytest tests/integration -q
      - run: HOC_REQUIRE_SERVICES=1 uv run pytest tests/golden -q
      - if: always()
        run: docker compose down -v
