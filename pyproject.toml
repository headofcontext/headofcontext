[project]
name = "headofcontext"
version = "0.0.1"
description = "Single authorization layer for enterprise AI agents: READ, ACT, DELEGATE, REMEMBER under one principal chain."
readme = "README.md"
keywords = ["authorization", "ai-agents", "openfga", "biscuit", "rag", "memory", "provenance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Typing :: Typed",
]
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "HeadOfContext contributors" }]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "openfga-sdk>=0.9",
  "biscuit-python>=0.4",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "opentelemetry-semantic-conventions>=0.49b0",
  "joserfc>=1.0",
  "uvicorn[standard]>=0.30",
  "psycopg-pool>=3.2",
]

[project.optional-dependencies]
# Memory backends are optional: the adapters import them lazily (ADR 0007).
mem0 = ["mem0ai>=0.1"]
zep = ["zep-cloud>=2.0"]
# Framework integrations are optional too (ADR 0009).
langgraph = ["langgraph>=1.0", "langchain-core>=1.0"]
crewai = ["crewai>=1.0"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.115",
  "ruff>=0.7",
  "mypy>=1.13",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0",
]
mcp = [
    "mcp>=2",
]
pydanticai = [
    "pydantic-ai-slim>=2",
]

[project.urls]
Homepage = "https://headofcontext.com"
Documentation = "https://docs.headofcontext.com"
Changelog = "https://github.com/headofcontext/headofcontext/blob/main/CHANGELOG.md"

[project.scripts]
hoc = "headofcontext.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/headofcontext", "docs/adr", "docs/threat-model.md", "docs/boundary.md", "docs/openapi.json", "docs/authz-model.fga", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "SECURITY.md", "AGENTS.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/headofcontext"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.115",
  "ruff>=0.7",
  "mypy>=1.13",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "ANN", "RUF", "SIM", "PL"]
ignore = [
  "S101",    # assert is fine in tests
  "PLR2004", # magic values in tests
  "PLR0913", # many args are fine on typed constructors
  "ANN401",  # Any is sometimes needed at boundaries
  "N818",    # HocError subclasses are named after the condition (AGENTS.md conventions)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PL", "ANN"]
"tests/unit/connectors/test_nextcloud.py" = ["E501"]  # recorded WebDAV response
"tests/unit/connectors/test_pipeshub.py" = ["E501"]  # recorded API responses
"fixtures/**" = ["S", "PL", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["biscuit_auth", "biscuit_auth.*", "openfga_sdk", "openfga_sdk.*", "authlib", "authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires docker compose services",
  "adversarial: attack scenarios, must all be blocked",
  "golden: ACME golden set, must be 100% green end to end",
]
filterwarnings = ["error::DeprecationWarning:headofcontext.*"]
