{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "headofcontext.fullname" . }}
  labels: {{- include "headofcontext.labels" . | nindent 4 }}
type: Opaque
stringData:
  HOC_POSTGRES_DSN: {{ required "postgres.dsn or existingSecret is required" .Values.postgres.dsn | quote }}
  HOC_OIDC_CLIENT_SECRET: {{ required "secrets.oidcClientSecret or existingSecret is required" .Values.secrets.oidcClientSecret | quote }}
  HOC_ROOT_KEY_HEX: {{ required "secrets.rootKeyHex or existingSecret is required" .Values.secrets.rootKeyHex | quote }}
  HOC_APPROVAL_WEBHOOK_SECRET: {{ .Values.secrets.approvalWebhookSecret | quote }}
  HOC_ZEP_API_KEY: {{ .Values.secrets.zepApiKey | quote }}
{{- end }}
